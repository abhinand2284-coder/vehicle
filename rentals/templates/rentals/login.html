{% extends "rentals/base.html" %}

{% block title %}
Login | DriveRent
{% endblock %}

{% block content %}

<style>
    .auth-page {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;

        background:
            radial-gradient(circle at top left, #263b60, transparent 45%),
            linear-gradient(135deg, #0b1220, #17253b);

        box-sizing: border-box;
    }

    .auth-box {
        width: 100%;
        max-width: 440px;
        padding: 40px;
        box-sizing: border-box;

        background: rgba(255, 255, 255, 0.98);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 20px;

        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);

        animation: loginAppear 0.6s ease;
    }

    .brand {
        text-align: center;
        margin-bottom: 28px;
    }

    .brand-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        width: 58px;
        height: 58px;
        margin-bottom: 12px;

        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: white;
        border-radius: 16px;

        font-size: 28px;
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }

    .brand h1 {
        color: #111827;
        font-size: 30px;
        margin: 0 0 8px;
        font-weight: 800;
        letter-spacing: -0.8px;
    }

    .brand h1 span {
        color: #2563eb;
    }

    .brand p {
        color: #6b7280;
        font-size: 14px;
        margin: 0;
    }

    .auth-heading {
        color: #111827;
        font-size: 23px;
        margin: 0 0 8px;
    }

    .auth-subtitle {
        color: #6b7280;
        font-size: 14px;
        margin: 0 0 26px;
    }

    .auth-box form p {
        margin: 0 0 19px;
    }

    .auth-box label {
        display: block;
        color: #374151;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .auth-box input {
        display: block;
        width: 100%;
        padding: 13px 14px;
        box-sizing: border-box;

        border: 1px solid #d1d5db;
        border-radius: 9px;
        background: #f9fafb;

        font-size: 15px;
        color: #111827;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .auth-box input:focus {
        outline: none;
        border-color: #2563eb;
        background: white;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .auth-box ul {
        color: #dc2626;
        font-size: 13px;
        padding-left: 20px;
    }

    .auth-box .errorlist {
        color: #dc2626;
        font-size: 13px;
        margin: 6px 0 0;
    }

    .auth-button {
        width: 100%;
        border: none;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: white;

        padding: 14px;
        border-radius: 10px;

        font-size: 15px;
        font-weight: 700;
        cursor: pointer;

        transition: transform 0.2s, box-shadow 0.2s;
    }

    .auth-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 9px 20px rgba(37, 99, 235, 0.3);
    }

    .auth-footer {
        text-align: center;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;

        color: #6b7280;
        font-size: 14px;
    }

    .auth-footer a {
        color: #2563eb;
        font-weight: 700;
        text-decoration: none;
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }

    @keyframes loginAppear {
        from {
            opacity: 0;
            transform: translateY(15px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 480px) {
        .auth-page {
            padding: 35px 15px;
        }

        .auth-box {
            padding: 28px 22px;
        }
    }
</style>

<section class="auth-page">
    <div class="auth-box">

        <div class="brand">
            <div class="brand-icon">🚘</div>

            <h1>Drive<span>Rent</span></h1>

            <p>Your journey starts here.</p>
        </div>

        <h2 class="auth-heading">Welcome Back!</h2>

        <p class="auth-subtitle">
            Login to your account and find your next ride.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-button">
                Login to DriveRent →
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="{% url 'register' %}">Create Account</a>
        </div>

    </div>
</section>

{% endblock %}
```
