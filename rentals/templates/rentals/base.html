<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        DriveRent
        {% endblock %}
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        
        nav {
                background: #111827;
                padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

        .logo {
            color: white;
            font-size: 27px;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: -1px;
}

        .logo span {
    color: #60a5fa;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 25px;
    flex-wrap: wrap;
}

    .nav-links a {
    color: #e5e7eb;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: color 0.2s ease;
    }

    .nav-links a:hover {
    color: #60a5fa;
    }


        .container {
            width: 86%;
            max-width: 1200px;
            margin: auto;
        }

        footer {
            margin-top: 60px;
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
        }

    </style>

</head>


<body>

    
<nav>
    <a href="/" class="logo">Drive<span>Rent</span></a>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/vehicles/">Vehicles</a>

        {% if user.is_authenticated %}
            <a href="/my-bookings/">My Bookings</a>
            <a href="#">{{ user.username }}</a>
            <a href="/logout/">Logout</a>
        {% else %}
            <a href="/login/">Login</a>
            <a href="/register/">Register</a>
        {% endif %}

        {% if user.is_staff %}
            <a href="/dashboard/">Admin Dashboard</a>
        {% endif %}
    </div>
</nav>



    {% block content %}

    {% endblock %}


</body>

</html>
